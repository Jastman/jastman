name: Update random Cesium point

on:
  schedule:
    # Runs at 10:00 UTC (6:00 AM EDT / 5:00 AM EST) every day
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      location:
        description: 'Optional exact curated location to render for testing'
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Generate cinematic world zoom GIF
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          RENDER_LOCATION: ${{ inputs.location }}
        run: npm run generate

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/random-point.gif assets/random-point.png assets/random-point-caption.md assets/world-zooms/ README.md
          git diff --quiet --cached || git commit -m "Update daily world zoom GIF"
          git push