<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer {
      width: 1200px;
      height: 630px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // ION_TOKEN, LON, LAT, HEIGHT get string-replaced in by the node script
    Cesium.Ion.defaultAccessToken = "ION_TOKEN";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
    });

    window.renderComplete = false;

    (async () => {
      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(96188); // Cesium World Terrain + OSM Buildings style asset; swap if needed
        viewer.scene.primitives.add(tileset);
      } catch (e) {
        // fall back to just terrain/imagery if the buildings tileset isn't reachable
      }

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(LON, LAT, HEIGHT),
        orientation: {
          heading: Cesium.Math.toRadians(30),
          pitch: Cesium.Math.toRadians(-30),
          roll: 0,
        },
        duration: 0,
      });

      // give tiles a few seconds to stream in before we screenshot
      setTimeout(() => {
        window.renderComplete = true;
      }, 6000);
    })();
  </script>
</body>
</html>
