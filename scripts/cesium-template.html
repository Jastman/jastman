<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cesium GitHub Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'INJECT_TOKEN_HERE';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      baseLayerPicker: false,
      baseLayer: false,
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false
    });

    viewer.scene.globe.show = false;

    // Expose frame-capture hook for Puppeteer
    window.captureFrame = null;
    window.renderComplete = false;
    window.zoomStarted = false;

    async function loadTiles() {
      try {
        const googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
        viewer.scene.primitives.add(googleTileset);

        const targetLon = LON;
        const targetLat = LAT;
        const rawHeight = HEIGHT;
        const randomHeading = Math.floor(Math.random() * 360);
        const centerCartesian = Cesium.Cartesian3.fromDegrees(targetLon, targetLat, 0);

        // Start high (cinematic orbit altitude) then zoom down
        const startRange = 18000; // ~18 km up
        const endRange = Math.max(rawHeight * 0.5, 450);

        // Instantly position camera at high altitude
        viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(centerCartesian, 0), {
          offset: new Cesium.HeadingPitchRange(
            Cesium.Math.toRadians(randomHeading),
            Cesium.Math.toRadians(-35),
            startRange
          ),
          duration: 0,
          complete: function() {
            // Let tiles load at initial position before starting zoom
            setTimeout(() => {
              window.zoomStarted = true;

              // Cinematic zoom: descend from 18km → final altitude over ~20 seconds
              viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(centerCartesian, 0), {
                offset: new Cesium.HeadingPitchRange(
                  Cesium.Math.toRadians(randomHeading + 25), // slight orbit during descent
                  Cesium.Math.toRadians(-45),
                  endRange
                ),
                duration: 20,
                easingFunction: Cesium.EasingFunction.QUINTIC_IN_OUT,
                complete: function() {
                  // Extra settle time for final textures at ground level
                  setTimeout(() => {
                    window.renderComplete = true;
                  }, 5000);
                }
              });
            }, 8000); // Initial tile load wait
          }
        });

      } catch (error) {
        console.error('Error loading Google 3D Tiles:', error);
        window.renderComplete = true;
      }
    }

    loadTiles();
  </script>
</body>
</html>
