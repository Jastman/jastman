<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cesium GitHub Map</title>
  <!-- Using Cesium v1.120 to match your previous workflow runs -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // 1. Placeholder that will be dynamically replaced by Node.js
    Cesium.Ion.defaultAccessToken = 'INJECT_TOKEN_HERE';

    // 2. Initialize Viewer. Disable baseLayer and terrain since Google Tiles cover everything
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      baseLayerPicker: false,
      baseLayer: false, // Disables default satellite imagery to speed up load time
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false
    });

    // 3. Load Google Photorealistic 3D Tiles
    async function loadTiles() {
      try {
        const googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
        viewer.scene.primitives.add(googleTileset);

        // 4. Fly to the dynamically injected coordinates
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(LON, LAT, HEIGHT),
          orientation: {
            heading: Cesium.Math.toRadians(30),
            pitch: Cesium.Math.toRadians(-30),
            roll: 0,
          },
          duration: 0, // Instant movement for headless environment
          complete: function() {
            // A small 3-second delay gives the software WebGL renderer time 
            // to fetch and display the detailed 3D tiles before taking the screenshot
            setTimeout(() => {
              window.renderComplete = true;
            }, 3000); 
          }
        });
      } catch (error) {
        console.error('Error loading Google 3D Tiles:', error);
        // Fail-safe to ensure Puppeteer doesn't hang indefinitely if tiles fail to load
        window.renderComplete = true; 
      }
    }
    
    loadTiles();
  </script>
</body>
</html>
