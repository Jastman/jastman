<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cesium GitHub Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'INJECT_TOKEN_HERE';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      baseLayerPicker: false,
      baseLayer: false, 
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false
    });

    // 1. Hide the default globe so the blue sphere doesn't cover the Google 3D Tiles
    viewer.scene.globe.show = false;

    async function loadTiles() {
      try {
        const googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
        viewer.scene.primitives.add(googleTileset);

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(LON, LAT, HEIGHT),
          orientation: {
            heading: Cesium.Math.toRadians(30),
            pitch: Cesium.Math.toRadians(-30),
            roll: 0,
          },
          duration: 0, 
          complete: function() {
            // 2. Increase the screenshot delay to 15 seconds
            // This gives the software WebGL renderer ample time to fetch and draw the 3D tiles
            setTimeout(() => {
              window.renderComplete = true;
            }, 15000); 
          }
        });
      } catch (error) {
        console.error('Error loading Google 3D Tiles:', error);
        window.renderComplete = true; 
      }
    }
    
    loadTiles();
  </script>
</body>
</html>
