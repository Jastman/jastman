<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cesium GitHub Map</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'INJECT_TOKEN_HERE';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      baseLayerPicker: false,
      baseLayer: false, 
      fullscreenButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false
    });

    // Hide the default globe to prevent the blue sphere from interfering with 3D Tiles
    viewer.scene.globe.show = false;

    async function loadTiles() {
      try {
        const googleTileset = await Cesium.Cesium3DTileset.fromIonAssetId(2275207);
        viewer.scene.primitives.add(googleTileset);

        // Parsed from Node injection
        const targetLon = LON;
        const targetLat = LAT;
        const rawHeight = HEIGHT;

        // ADAPTIVE FRAMING LOGIC:
        // Determine if this is a tight urban building/monument or a massive natural wonder
        const isStructure = rawHeight <= 2000;
        
        // Structures get a much closer zoom and a tighter, more dramatic tilt
        // Natural wonders stay further back with a wider overview pitch
        const cameraHeight = isStructure ? Math.max(rawHeight, 450) : rawHeight;
        const pitchAngle = isStructure ? -35 : -50; 

        // Randomize the heading slightly (0 to 360 degrees) so the view angle changes organically
        const randomHeading = Math.floor(Math.random() * 360);

        const centerCartesian = Cesium.Cartesian3.fromDegrees(targetLon, targetLat, 0);

        // Use Cesium's HeadingPitchRange to frame the target perfectly in the center of the screen,
        // applying an intelligent offset based on the camera angle.
        const rangeDistance = isStructure ? 600 : cameraHeight * 0.6;
        
        const headingPitchRange = new Cesium.HeadingPitchRange(
          Cesium.Math.toRadians(randomHeading),
          Cesium.Math.toRadians(pitchAngle),
          rangeDistance
        );

        viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(centerCartesian, 0), {
          offset: headingPitchRange,
          duration: 0, // Instant transition for headless runner
          complete: function() {
            // 15-second delay to ensure SwiftShader fully streams the 3D geometry
            setTimeout(() => {
              window.renderComplete = true;
            }, 15000); 
          }
        });

      } catch (error) {
        console.error('Error loading Google 3D Tiles:', error);
        window.renderComplete = true; 
      }
    }
    
    loadTiles();
  </script>
</body>
</html>
